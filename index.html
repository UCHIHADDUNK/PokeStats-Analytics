<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Dashboard</title>
  <link rel="stylesheet" href="acceso.css">
</head>
<body>

  <div class="access-container">
    <div class="access-card">
      <h1>Acceso</h1>
      <p>Ingresa la contraseña para continuar</p>

      <input type="password" id="passwordInput" placeholder="Contraseña">

      <button id="loginBtn">Entrar</button>

      <div id="errorMsg" class="error"></div>
    </div>
  </div>s

  <script>
    const PASSWORD = "UNITEC"; // 🔐 CAMBIA TU CONTRASEÑA AQUÍ

    document.getElementById("loginBtn").addEventListener("click", checkPass);
    document.getElementById("passwordInput").addEventListener("keypress", e => {
      if (e.key === "Enter") checkPass();
    });

    function checkPass() {
      const entered = document.getElementById("passwordInput").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (entered === PASSWORD) {
        window.location.href = "dashboard.html"; // ⬅ redirige a tu dashboard
      } else {
        errorMsg.textContent = "Contraseña incorrecta";
        document.getElementById("passwordInput").value = "";
      }
    }
  </script>

</body>
</html>
